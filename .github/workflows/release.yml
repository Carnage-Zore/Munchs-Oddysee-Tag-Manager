name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docs into addons module folder
        run: |
          cp README.md munchs_oddysee_tag_manager/
          cp LICENSE munchs_oddysee_tag_manager/

      - name: Zip
        run: |
          zip -r "Munchs Oddysee Tag Manager.zip" munchs_oddysee_tag_manager/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "Munchs Oddysee Tag Manager.zip"
