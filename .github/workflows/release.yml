name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy docs into addons module folder
        run: |
          cp README.md munchs_oddysee_tag_manager/
          cp LICENSE munchs_oddysee_tag_manager/

      - name: Zip
        run: |
          zip -r "MunchsOddyseeTagManager.zip" munchs_oddysee_tag_manager/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: "MunchsOddyseeTagManager.zip"
